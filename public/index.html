<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flood Watch</title>
  <meta name="description" content="Warn your neighbours about flooding. In English, Twi and Dagbani, by voice or by tapping." />
  <meta name="theme-color" content="#0F3D5E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Icon sprite: simple shapes so meaning never depends on reading or colour alone -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-wave" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.3 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="currentColor"/><circle cx="6" cy="12" r="3" fill="currentColor"/><circle cx="18" cy="19" r="3" fill="currentColor"/><path stroke="currentColor" stroke-width="2" d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></symbol>
      <symbol id="i-thumb" viewBox="0 0 24 24"><path fill="currentColor" d="M2 10h4v11H2zM8 21h9.3a2 2 0 0 0 2-1.6l1.6-7A2 2 0 0 0 19 10h-5.5l.8-4a2 2 0 0 0-3.5-1.6L8 9.5V21z"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path fill="currentColor" d="M7 17a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 8a4.5 4.5 0 0 1-.5 9H7z"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 20l-1 2M12 20l-1 2M16 20l-1 2"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4l13 8-13 8z"/></symbol>

      <!-- Water-level pictures: a person with water at the ankle / knee / waist -->
      <symbol id="lvl-watching" viewBox="0 0 64 64">
        <circle cx="32" cy="12" r="6" fill="currentColor"/>
        <path d="M32 20v20M32 40l-7 16M32 40l7 16M32 26l-10 8M32 26l10 8" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M4 54c5-3 9-3 14 0s9 3 14 0 9-3 14 0 9 3 14 0v10H4z" fill="#2B7BB9" opacity=".9"/>
      </symbol>
      <symbol id="lvl-rising" viewBox="0 0 64 64">
        <circle cx="32" cy="12" r="6" fill="currentColor"/>
        <path d="M32 20v20M32 40l-7 16M32 40l7 16M32 26l-10 8M32 26l10 8" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M4 44c5-3 9-3 14 0s9 3 14 0 9-3 14 0 9 3 14 0v20H4z" fill="#2B7BB9" opacity=".9"/>
        <path d="M54 30v-12M50 22l4-4 4 4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </symbol>
      <symbol id="lvl-danger" viewBox="0 0 64 64">
        <circle cx="32" cy="12" r="6" fill="currentColor"/>
        <path d="M32 20v20M32 26l-12-8M32 26l12-8" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M4 32c5-3 9-3 14 0s9 3 14 0 9-3 14 0 9 3 14 0v32H4z" fill="#2B7BB9" opacity=".95"/>
      </symbol>
    </defs>
  </svg>

  <main id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px">Flood Watch needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
